plugins {
    id "com.android.application"
    id "kotlin-android"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    // END: FlutterFire Configuration
    id "dev.flutter.flutter-gradle-plugin"
}

apply from: '../env_dart_defines.gradle'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 36

    ndkVersion = "29.0.14206865"

    namespace "com.chanawoo.app"

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.chanawoo.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        
        compileOptions {
            // Flag to enable support for the new language APIs
            coreLibraryDesugaringEnabled true
            // Sets Java compatibility to Java 8
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        if (keystorePropertiesFile.exists()) {
            debug  {
                signingConfig signingConfigs.release
            }
            profile {
                signingConfig signingConfigs.release
            }
        }
        release {
            signingConfig signingConfigs.release
            firebaseCrashlytics {
                // Enable processing and uploading of native symbols to Crashlytics servers.
                // By default, this is disabled to improve build speeds.
                // This flag must be enabled to see properly-symbolicated native
                // stack traces in the Crashlytics dashboard.
                nativeSymbolUploadEnabled true
                strippedNativeLibsDir 'build/intermediates/stripped_native_libs/release/out/lib'
                unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/release/out/lib'
            }
        }
    }
    lint {
        disable 'InvalidPackage'
    }

    // Gradle sometimes corrupts arm64 libflutter.so during transform (invalid ELF,
    // ~157MB unstripped blob). After strip, replace bad/missing copies with the
    // known-good engine library bundled beside this file.
    applicationVariants.configureEach { variant ->
        if (variant.buildType.name != "release") {
            return
        }
        def stripTask = tasks.findByName("strip${variant.name.capitalize()}DebugSymbols")
        if (stripTask == null) {
            return
        }
        stripTask.doFirst {
            def fallback = rootProject.file("libflutter-arm64-v8a-release.so")
            if (!fallback.exists()) {
                def jetified = null
                fileTree("${gradle.gradleUserHomeDir}/caches").matching {
                    include "**/jetified-arm64_v8a_release-*/arm64-v8a/libflutter.so"
                }.files.each { candidate ->
                    def probe = ["file", candidate.absolutePath].execute()
                    probe.waitFor()
                    if (probe.text.contains("debug_info") && !probe.text.contains("section table")) {
                        jetified = candidate
                    }
                }
                if (jetified != null) {
                    exec {
                        commandLine "${android.ndkDirectory}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip",
                            "-o", fallback.absolutePath, jetified.absolutePath
                    }
                    logger.lifecycle("Generated ${fallback.name} from ${jetified.name}")
                }
            }
        }
        stripTask.doLast {
            def fallback = rootProject.file("libflutter-arm64-v8a-release.so")
            if (!fallback.exists()) {
                return
            }
            stripTask.outputs.files.each { outputRoot ->
                def armFlutter = new File(outputRoot, "lib/arm64-v8a/libflutter.so")
                def needsFix = !armFlutter.exists() || armFlutter.length() > 50_000_000
                if (needsFix) {
                    copy {
                        from fallback
                        into armFlutter.parentFile
                        rename { "libflutter.so" }
                    }
                    logger.lifecycle("Replaced bad arm64 libflutter.so with ${fallback.name}")
                }
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation "androidx.activity:activity:1.4.0"
    implementation "androidx.fragment:fragment:1.4.1"
    implementation 'com.google.firebase:firebase-crashlytics-ndk:18.2.11'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
    implementation 'com.github.UnifiedPush:android-foss_embedded_fcm_distributor:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
